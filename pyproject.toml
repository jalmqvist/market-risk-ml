[build-system]
requires = ["setuptools>=68,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "mrml"
version = "0.1.0"
description = "Market Risk ML execution and risk layer"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
    "pyarrow>=17,<22",
    "requests>=2.32.5,<3",
    "SQLAlchemy>=2.0.54,<3",
    "alembic>=1.20,<2",
    "psycopg[binary]>=3.3.6,<4",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13,<2",
    "pre-commit>=4,<5",
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["parity: deterministic replay and artifact-parity scaffold"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mrml.contracts", "mrml.contracts.*"]
strict = true
